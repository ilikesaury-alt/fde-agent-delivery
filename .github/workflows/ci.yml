name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 质量门：两产品矩阵（typecheck → test → build → 产物校验）
  quality:
    name: quality / ${{ matrix.product }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [product1, product2]
    defaults:
      run:
        working-directory: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.product }}/package-lock.json

      # CI 上正常安装（沙箱里才需要 --ignore-scripts 绕开 postinstall 的 spawn 限制）
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 构建产物校验（SSR bundle + client 资产 + wrangler 配置）
        run: |
          set -euo pipefail
          test -f dist/ssr/index.js
          test -f dist/ssr/wrangler.json
          test -d dist/client
          test -d dist/client/assets
          echo "SSR: $(du -h dist/ssr/index.js | cut -f1) | client assets: $(ls dist/client/assets | wc -l) 个"

      - name: 构建产物无密钥校验
        run: |
          set -euo pipefail
          if grep -rInE "sk-[A-Za-z0-9]{16,}|MAGPIE_API_KEY *= *[\"'][^\"']+" dist/ ; then
            echo "✖ 构建产物中疑似出现明文凭据"; exit 1
          fi
          echo "✔ dist/ 无明文凭据"

  # 文档链接校验：防止文档移动后出现断链
  docs:
    name: docs / 链接与路径校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验 markdown 相对链接
        run: node .github/scripts/check-doc-links.mjs

  # 本地沙箱跑不了 vite dev（workerd 需 spawn），放到 CI 里补这一次真实启动验证
  dev-smoke:
    name: dev server smoke（advisory）
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    defaults:
      run:
        working-directory: product1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product1/package-lock.json
      - run: npm ci
      - name: 启动 vite dev 并探活 /api/health
        run: |
          set -uo pipefail
          npm run dev -- --port 5188 --strictPort > /tmp/vite-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5188/api/health > /tmp/health.json 2>/dev/null; then
              echo "✔ dev server 就绪：$(cat /tmp/health.json)"
              exit 0
            fi
            sleep 2
          done
          echo "✖ dev server 120s 内未就绪"; cat /tmp/vite-dev.log; exit 1
