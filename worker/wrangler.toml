# Cloudflare Worker 配置 — 会议记录整理日报

name = "meeting-digest-worker"
main = "src/index.ts"
compatibility_date = "2025-10-14"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# 敏感凭据：不要在本文件写真实密钥（会进 git）。
#   MAGPIE_API_KEY  → wrangler secret put MAGPIE_API_KEY
#                 或 Cloudflare Dashboard > Workers > Settings > Variables and Secrets
# 非敏感项可留在下面 [vars]。
# ---------------------------------------------------------------------------

[vars]
# magpie 中转（OpenAI 兼容）。E2E 前请在 Dashboard 填真实值。
MAGPIE_BASE_URL = "https://api.magpie.example/v1"
MAGPIE_MODEL = "deepseek-chat"   # 可改 gpt-4o-mini 等

# 可选：把 CORS 收紧到单一来源（如你的 Pages 域名）。
# 留空 = 允许任意来源（个人工具默认）。上线建议填上，避免配额被他人站点消耗。
ALLOWED_ORIGIN = ""

# 注意：长文本阈值 MAX_INPUT_CHARS 不在本文件配置。
# 它是代码常量（src/prompt.ts），改阈值请改代码并跑测试，避免「配了却不生效」的死配置。
